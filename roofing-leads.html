    <style>
        :root{
            --primary:#C8902A; --primary-dark:#A87020; --primary-light:#E8B050;
            --dark:#0D1117; --mid:#2D3748; --light-bg:#F7F8FA;
            --text:#1A202C; --text-muted:#6B7280; --border:#E5E7EB; --white:#FFFFFF;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--light-bg);color:var(--text);line-height:1.5;}
        header{background:var(--dark);color:var(--white);padding:24px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
        .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.4rem;letter-spacing:.5px;}
        .brand .top{color:var(--white);} .brand .cal{color:var(--primary);}
        .brand i{color:var(--primary);font-size:1.6rem;}
        header h1{font-size:1rem;font-weight:500;color:var(--text-muted);}
        .wrap{max-width:1280px;margin:0 auto;padding:32px;}
        .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px;}
        .search{flex:1;min-width:220px;position:relative;}
        .search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);}
        .search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--border);border-radius:8px;font-size:.95rem;background:var(--white);}
        .search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(200,144,42,.15);}
        select{padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:.95rem;background:var(--white);cursor:pointer;}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;text-decoration:none;transition:background .2s;}
        .btn-primary{background:var(--primary);color:var(--white);}
        .btn-primary:hover{background:var(--primary-dark);}
        .stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
        .stat{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 20px;min-width:120px;}
        .stat .num{font-size:1.6rem;font-weight:800;color:var(--primary);}
        .stat .lbl{font-size:.8rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
        .table-card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);}
        .table-scroll{overflow-x:auto;}
        table{width:100%;border-collapse:collapse;font-size:.9rem;}
        thead th{background:var(--dark);color:var(--white);text-align:left;padding:13px 16px;font-weight:600;white-space:nowrap;position:sticky;top:0;}
        tbody td{padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap;}
        tbody tr:hover{background:#FBF7EF;}
        tbody tr:last-child td{border-bottom:none;}
        a.tel{color:var(--primary-dark);text-decoration:none;font-weight:500;}
        a.tel:hover{text-decoration:underline;}
        .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;}
        .b-cancelled{background:#FEE2E2;color:#B91C1C;}
        .b-noshow{background:#FEF3C7;color:#92400E;}
        .b-noanswer{background:#E5E7EB;color:#374151;}
        .b-followup{background:#DBEAFE;color:#1E40AF;}
        .b-onelegger{background:#EDE9FE;color:#6D28D9;}
        .b-other{background:#E5E7EB;color:#374151;}
        .empty{padding:40px;text-align:center;color:var(--text-muted);}
        footer{text-align:center;color:var(--text-muted);font-size:.82rem;padding:24px;}
        @media(max-width:640px){.wrap{padding:16px;}header{padding:18px 16px;}}
    </style>

    // ---- Minimal CSV parser (handles quoted fields) ----
    function parseCSV(text){
        const rows=[]; let row=[], field='', q=false;
        for(let i=0;i<text.length;i++){
            const c=text[i];
            if(q){
                if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
                else field+=c;
            } else {
                if(c==='"') q=true;
                else if(c===','){ row.push(field); field=''; }
                else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
                else if(c==='\r'){}
                else field+=c;
            }
        }
        if(field!==''||row.length){ row.push(field); rows.push(row); }
        return rows;
    }

    const raw=parseCSV(CSV);
    const headers=raw[0];
    const leads=raw.slice(1).map(r=>({
        source:r[0],consultant:r[1],name:r[2],phone:r[3],status:r[4],
        product:r[6],followDate:r[8],followTime:r[9]
    }));

    const badgeClass=s=>{
        const k=s.toLowerCase();
        if(k.includes('cancel'))return'b-cancelled';
        if(k.includes('no show'))return'b-noshow';
        if(k.includes('no answer'))return'b-noanswer';
        if(k.includes('follow'))return'b-followup';
        if(k.includes('legger'))return'b-onelegger';
        return'b-other';
    };
    const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

    const tbody=document.getElementById('tbody');
    const empty=document.getElementById('empty');
    const searchEl=document.getElementById('search');
    const statusEl=document.getElementById('statusFilter');

    [...new Set(leads.map(l=>l.status))].sort().forEach(s=>{
        const o=document.createElement('option');o.value=s;o.textContent=s;statusEl.appendChild(o);
    });

    function render(){
        const q=searchEl.value.trim().toLowerCase();
        const sf=statusEl.value;
        const rows=leads.filter(l=>{
            if(sf&&l.status!==sf)return false;
            if(!q)return true;
            return [l.name,l.phone,l.consultant,l.product,l.source].join(' ').toLowerCase().includes(q);
        });
        tbody.innerHTML=rows.map((l,i)=>{
            const fu=[l.followDate,l.followTime].filter(Boolean).join(' ');
            const tel=l.phone?`<a class="tel" href="tel:${l.phone.replace(/[^\d+]/g,'')}">${esc(l.phone)}</a>`:'<span style="color:#9CA3AF">—</span>';
            return `<tr>
                <td>${i+1}</td>
                <td><strong>${esc(l.name)}</strong></td>
                <td>${tel}</td>
                <td>${esc(l.product)}</td>
                <td><span class="badge ${badgeClass(l.status)}">${esc(l.status)}</span></td>
                <td>${esc(l.consultant)||'<span style="color:#9CA3AF">—</span>'}</td>
                <td>${esc(l.source)||'<span style="color:#9CA3AF">—</span>'}</td>
                <td>${esc(fu)||'<span style="color:#9CA3AF">—</span>'}</td>
            </tr>`;
        }).join('');
        empty.style.display=rows.length?'none':'block';
        document.getElementById('count').textContent=rows.length;
        renderStats(rows);
    }

    function renderStats(rows){
        const counts={};
        rows.forEach(l=>counts[l.status]=(counts[l.status]||0)+1);
        const cards=[['Total',rows.length]].concat(Object.entries(counts).sort((a,b)=>b[1]-a[1]));
        document.getElementById('stats').innerHTML=cards.map(([k,v])=>
            `<div class="stat"><div class="num">${v}</div><div class="lbl">${esc(k)}</div></div>`).join('');
    }

    document.getElementById('download').addEventListener('click',()=>{
        const blob=new Blob([CSV],{type:'text/csv;charset=utf-8;'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download='topcal-roofing-leads.csv';
        document.body.appendChild(a);a.click();a.remove();
        URL.revokeObjectURL(url);
    });

    searchEl.addEventListener('input',render);
    statusEl.addEventListener('change',render);
    render();
